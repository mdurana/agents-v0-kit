# Optional GitLab CI pipeline for teams using /v0-release.
# Runs the bound stack pack's native backend verify, frontend verify, e2e, perf, and secret detection.

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
    rules:
      - if: $ENABLE_GITLAB_SAST == "1"

stages:
  - test
  - security
  - sast
  - e2e
  - perf
  - delivery-gate

default:
  interruptible: true

variables:
  CI_IMAGE_PREFIX: ""
  GIT_SUBMODULE_STRATEGY: recursive

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: test
  image: ${CI_PACK_IMAGE:-${CI_IMAGE_PREFIX}eclipse-temurin:21-jdk}
  services:
    - name: ${CI_IMAGE_PREFIX}docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    key: "maven-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      set -eu
      set -o pipefail
      if ! command -v python3 >/dev/null 2>&1; then
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache python3 >/dev/null
        fi
      fi
      repo="$(pwd)"
      eval "$(sh .agents-v0/scripts/resolve-layout.sh)"
      mkdir -p ci-artifacts
      pack_id="$(python3 -c 'import sys; sys.path.insert(0, ".agents-v0/scripts"); import packlib; print(packlib.profile_pack())')"
      pack_cmd="$(sh .agents-v0/scripts/run-backend-verify.sh || true)"
      svc_cmd="$(sh .agents-v0/scripts/run-backend-verify.sh "Service verify" || true)"
      if [ -n "$pack_cmd" ] || [ -n "$svc_cmd" ]; then
        if [ -n "$pack_cmd" ] && { [ -n "${BACKEND_ROOT:-}" ] || [ -z "${BFF_ROOT:-}${SERVICE_ROOTS:-}" ]; }; then
          sh -c "$pack_cmd" 2>&1 | tee -a "$repo/ci-artifacts/verify.log"
        fi
        for svc in ${BFF_ROOT:-} ${SERVICE_ROOTS:-}; do
          [ -n "$svc" ] && [ -d "$repo/$svc" ] || continue
          if [ -n "$svc_cmd" ]; then
            cmd="$(printf '%s' "$svc_cmd" | sed "s|{root}|$svc|g")"
            sh -c "$cmd" 2>&1 | tee -a "$repo/ci-artifacts/verify.log"
          elif [ -n "$pack_cmd" ]; then
            cmd="$(printf '%s' "$pack_cmd" | sed "s|^cd [^ ]* && |cd $svc && |")"
            sh -c "$cmd" 2>&1 | tee -a "$repo/ci-artifacts/verify.log"
          fi
        done
      elif [ -n "${BACKEND_ROOT:-}" ] && [ -f "$repo/$BACKEND_ROOT/pom.xml" ]; then
        cd "$repo/$BACKEND_ROOT"
        if [ -x ./mvnw ]; then MVN=./mvnw; else MVN=mvn; fi
        "$MVN" -B clean verify 2>&1 | tee -a "$repo/ci-artifacts/verify.log"
      fi
  artifacts:
    when: always
    paths:
      - ci-artifacts/
    expire_in: 1 week

frontend:
  stage: test
  image: ${CI_UI_IMAGE:-${CI_IMAGE_PREFIX}node:22-bookworm}
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists:
        - package.json
        - frontend/package.json
        - app/frontend/package.json
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - package.json
        - frontend/package.json
        - app/frontend/package.json
  script:
    - |
      set -eu
      set -o pipefail
      repo="$(pwd)"
      eval "$(sh .agents-v0/scripts/resolve-layout.sh)"
      root="${FRONTEND_ROOT:-}"
      if [ -z "$root" ]; then
        printf 'SKIP: layout has no frontend root\n'
        exit 0
      fi
      mkdir -p "$repo/ci-artifacts"
      front_cmd="$(sh .agents-v0/scripts/run-backend-verify.sh "Frontend verify" || true)"
      if [ -n "$front_cmd" ]; then
        case "$front_cmd" in
          *npm*)
            if [ -f "$repo/$root/package.json" ]; then
              (cd "$repo/$root" && npm ci)
            fi
            ;;
        esac
        (cd "$repo" && sh -c "$front_cmd") 2>&1 | tee "$repo/ci-artifacts/verify-frontend.log"
      elif [ -f "$repo/$root/package.json" ]; then
        cd "$repo/$root"
        npm ci
        if grep -q '"verify"' package.json; then npm run verify 2>&1 | tee "$repo/ci-artifacts/verify-frontend.log"
        elif grep -q '"test"' package.json; then npm test 2>&1 | tee "$repo/ci-artifacts/verify-frontend.log"
        else npm run build 2>&1 | tee "$repo/ci-artifacts/verify-frontend.log"
        fi
      fi
  artifacts:
    when: always
    paths:
      - ci-artifacts/
    expire_in: 1 week

e2e:
  stage: e2e
  image: ${CI_IMAGE_PREFIX}mcr.microsoft.com/playwright:v1.48.0-jammy
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists:
        - frontend/playwright.config.ts
        - frontend/playwright.config.js
        - app/frontend/playwright.config.ts
        - app/frontend/playwright.config.js
        - playwright.config.ts
        - playwright.config.js
  script:
    - |
      set -eu
      eval "$(sh .agents-v0/scripts/resolve-layout.sh)"
      cd "${FRONTEND_ROOT:-.}"
      npm ci
      npx playwright test
  artifacts:
    when: always
    paths:
      - "**/playwright-report/"
    expire_in: 1 week

perf:
  stage: perf
  image:
    name: ${CI_IMAGE_PREFIX}grafana/k6:0.54.0
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists:
        - perf/*.js
      when: manual
      allow_failure: true
  script:
    - |
      set -eu
      mkdir -p ci-artifacts
      for f in perf/*.js; do
        k6 run --summary-export "ci-artifacts/k6-$(basename "$f" .js).json" "$f"
      done
  artifacts:
    when: always
    paths:
      - ci-artifacts/
    expire_in: 2 weeks

secret_detection:
  stage: security
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

delivery-metrics:
  stage: delivery-gate
  image: ${CI_IMAGE_PREFIX}alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache python3
  script:
    - sh .agents-v0/scripts/delivery-metrics.sh . | tee delivery-metrics.md
  artifacts:
    when: always
    paths:
      - delivery-metrics.md
    expire_in: 2 weeks
