# Local testing stack — build from ./Dockerfile (see docker/README.md).
# Run: ./scripts/run-local-container.sh

name: local-dev

services:
  app:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    image: ${APP_IMAGE:-local-app:local}
    ports:
      - "${APP_PORT:-8080}:${APP_CONTAINER_PORT:-8080}"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
