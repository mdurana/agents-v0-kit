name: local-dev

services:
  api:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-local-api:local}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/app
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
    depends_on:
      db:
        condition: service_healthy
  ui:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    image: ${UI_IMAGE:-local-ui:local}
    ports:
      - "${UI_PORT:-8081}:8080"
  db:
    image: postgres:15-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
