# Example build + supply-chain checks. Wire as a required check alongside delivery-approvals.yml.
name: Build and security

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      perf:
        description: "Run the k6 scripts under perf/ (attach the summary to a P4 slo-evidence row)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve layout
        id: layout
        run: |
          eval "$(sh ci/resolve-layout.sh)"
          echo "profile=${LAYOUT_PROFILE}" >>"$GITHUB_OUTPUT"
          echo "backend=${BACKEND_ROOT}" >>"$GITHUB_OUTPUT"
          echo "frontend=${FRONTEND_ROOT}" >>"$GITHUB_OUTPUT"
          echo "bff=${BFF_ROOT}" >>"$GITHUB_OUTPUT"
          echo "services=${SERVICE_ROOTS}" >>"$GITHUB_OUTPUT"

      - name: Layout covers every JVM module
        run: sh ci/check-layout-roots.sh

      - name: Set up Java
        if: steps.layout.outputs.backend != '' || steps.layout.outputs.bff != '' || steps.layout.outputs.services != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"
      - name: mvn verify
        if: steps.layout.outputs.backend != '' || steps.layout.outputs.bff != '' || steps.layout.outputs.services != ''
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          repo="$(pwd)"
          : > /tmp/verify.log
          # Run the gate script from the pull request's base so the pull request cannot rewrite its own check.
          gate="$repo/ci/check-gate-metrics.sh"
          if [ -n "${PR_BASE_SHA:-}" ] && git cat-file -e "${PR_BASE_SHA}:ci/check-gate-metrics.sh" 2>/dev/null; then
            git show "${PR_BASE_SHA}:ci/check-gate-metrics.sh" > /tmp/check-gate-metrics.sh
            gate=/tmp/check-gate-metrics.sh
          fi
          verify_maven() {
            root="$1"
            [ -n "$root" ] || return 0
            if [ ! -f "$repo/$root/pom.xml" ]; then
              printf 'FAIL: layout root %s has no pom.xml\n' "$root" >&2
              exit 1
            fi
            cd "$repo/$root"
            if [ -x ./mvnw ]; then MVN=./mvnw; else MVN=mvn; fi
            $MVN -B clean verify 2>&1 | tee -a /tmp/verify.log
            REQUIRE_CVE_REPORT=0
            if grep -q '<id>ci-security</id>' pom.xml; then
              $MVN -B verify -Pci-security 2>&1 | tee -a /tmp/verify.log
              REQUIRE_CVE_REPORT=1
            fi
            # Read JaCoCo, Surefire, and OWASP output instead of agent-written numbers.
            # Diff coverage is measured on pull requests.
            if [ -f "$gate" ]; then
              REQUIRE_CVE_REPORT="$REQUIRE_CVE_REPORT" DIFF_BASE="${PR_BASE_SHA:-}" sh "$gate" "$repo/$root"
            fi
            cd "$repo"
          }
          verify_maven "${{ steps.layout.outputs.backend }}"
          verify_maven "${{ steps.layout.outputs.bff }}"
          for svc in ${{ steps.layout.outputs.services }}; do verify_maven "$svc"; done
          if [ -f ci/check-known-failures.sh ]; then sh ci/check-known-failures.sh /tmp/verify.log; fi

      - name: Set up Node
        if: steps.layout.outputs.frontend != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ steps.layout.outputs.frontend }}/package-lock.json
      - name: npm verify
        if: steps.layout.outputs.frontend != ''
        run: |
          root="${{ steps.layout.outputs.frontend }}"
          if [ ! -f "$root/package.json" ]; then
            printf 'FAIL: layout frontend root %s has no package.json\n' "$root" >&2
            exit 1
          fi
          cd "$root"
          npm ci
          if grep -q '"verify"' package.json; then npm run verify 2>&1 | tee /tmp/verify.log
          elif grep -q '"test"' package.json; then npm test 2>&1 | tee /tmp/verify.log
          else npm run build 2>&1 | tee /tmp/verify.log
          fi
          if [ -f "$GITHUB_WORKSPACE/ci/check-known-failures.sh" ]; then sh "$GITHUB_WORKSPACE/ci/check-known-failures.sh" /tmp/verify.log; fi

  event-schemas:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Event schema evolution is additive
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Run the check from the pull request's base so the pull request cannot rewrite its own check.
          check="ci/check-event-schemas.sh"
          if git cat-file -e "${BASE_SHA}:ci/check-event-schemas.sh" 2>/dev/null; then
            git show "${BASE_SHA}:ci/check-event-schemas.sh" > /tmp/check-event-schemas.sh
            check=/tmp/check-event-schemas.sh
          fi
          if [ -f "$check" ]; then
            sh "$check" "$BASE_SHA" "$HEAD_SHA"
          fi

  design-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Design, endpoint authorization, and frontend call checks
        run: |
          # Run the ci/ scripts from the pull request's base so the pull request cannot rewrite its own checks.
          ci_dir=ci
          if git cat-file -e "${BASE_SHA}:ci/check-design.sh" 2>/dev/null; then
            mkdir -p /tmp/trusted-ci
            git archive "$BASE_SHA" ci | tar -x -C /tmp/trusted-ci
            ci_dir=/tmp/trusted-ci/ci
          fi
          if [ -f "$ci_dir/check-design-contracts.sh" ]; then sh "$ci_dir/check-design-contracts.sh"; fi
          if [ -f "$ci_dir/check-endpoint-auth.sh" ] && git ls-files '*.java' | grep -q .; then
            sh "$ci_dir/check-endpoint-auth.sh" "$(git merge-base "$BASE_SHA" HEAD)" HEAD
          fi
          if [ -f "$ci_dir/check-frontend-calls.sh" ] && ls openapi/*.yaml openapi/*.json >/dev/null 2>&1; then
            sh "$ci_dir/check-frontend-calls.sh"
          fi

  e2e:
    if: github.event_name == 'pull_request' && hashFiles('frontend/playwright.config.*', 'playwright.config.*') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Playwright
        run: |
          eval "$(sh ci/resolve-layout.sh)"
          cd "${FRONTEND_ROOT:-.}"
          npm ci
          npx playwright install --with-deps
          npx playwright test

  perf:
    if: github.event_name == 'workflow_dispatch' && inputs.perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: k6
        run: |
          mkdir -p ci-artifacts
          for f in perf/*.js; do
            k6 run --summary-export "ci-artifacts/k6-$(basename "$f" .js).json" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: k6-summaries
          path: ci-artifacts/

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Detect CodeQL languages
        id: langs
        run: |
          eval "$(sh ci/resolve-layout.sh)"
          langs=""
          if [ -n "${BACKEND_ROOT:-}" ] && [ -f "${BACKEND_ROOT}/pom.xml" ]; then langs="java"; fi
          if [ -n "${BFF_ROOT:-}" ] && [ -f "${BFF_ROOT}/pom.xml" ]; then langs="java"; fi
          if [ -n "${SERVICE_ROOTS:-}" ]; then langs="java"; fi
          if [ -n "${FRONTEND_ROOT:-}" ] && [ -f "${FRONTEND_ROOT}/package.json" ]; then
            langs="${langs:+$langs,}javascript-typescript"
          fi
          echo "languages=$langs" >>"$GITHUB_OUTPUT"
      - name: Init CodeQL
        if: steps.langs.outputs.languages != ''
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ steps.langs.outputs.languages }}
          # Source-only. Java findings are weaker than a compiled CodeQL database.
          # Use build-mode: autobuild (or a manual Maven build) when you need full Java analysis.
          build-mode: none
      - name: Analyze
        if: steps.langs.outputs.languages != ''
        uses: github/codeql-action/analyze@v3

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$tarball" gitleaks
      - name: Secret scan (full history)
        run: ./gitleaks detect --source . --no-banner --redact
