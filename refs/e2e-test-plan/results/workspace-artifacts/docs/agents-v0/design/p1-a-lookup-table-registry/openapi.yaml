openapi: 3.1.0
info:
  title: Finance Back-Office Portal — Lookup Table Registry API
  version: 1.0.0
paths:
  /api/v1/lookup-tables:
    post:
      operationId: createLookupTable
      summary: Register a lookup table definition and activate its immutable versioned snapshot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLookupTableRequest'
      responses:
        '201':
          description: Created lookup table definition and active version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTableVersionResponse'
        '400':
          description: Validation error (RFC 9457 ProblemDetail)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Duplicate key in uploaded lookup table entries (RFC 9457 ProblemDetail)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    get:
      operationId: listLookupTables
      summary: List registered lookup table definitions and their active version metadata
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of lookup table definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupTableVersionResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateLookupTableRequest:
      type: object
      required:
        - code
        - name
        - keyColumns
        - valueColumns
        - entries
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        keyColumns:
          type: array
          minItems: 1
          items:
            type: string
        valueColumns:
          type: array
          minItems: 1
          items:
            type: string
        entries:
          type: array
          items:
            type: object
            required:
              - entryKey
              - entryValue
            properties:
              entryKey:
                type: object
                additionalProperties: true
              entryValue:
                type: object
                additionalProperties: true
    LookupTableVersionResponse:
      type: object
      required:
        - id
        - code
        - name
        - versionNo
        - contentHash
        - rowCount
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        versionNo:
          type: integer
        contentHash:
          type: string
        rowCount:
          type: integer
    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
