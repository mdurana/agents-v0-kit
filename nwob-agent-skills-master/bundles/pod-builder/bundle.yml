schema_version: "2.0"

bundle:
  id: pod-builder
  name: Pod Builder
  version: "3.0.0"
  role: pod-builder
  description: >-
    Story-level design and implementation cycle — 7 skills: co-design (story-spec
    technical annex / story-tasks), design-package validation, AI-assisted
    implementation, per-increment review, MR draft copy, resolve comments, and peer
    MR audit (/audit). Does not author epic-spec, masterplan, architecture, flat
    component plans, or run orchestrate-design. Does not create story-plan.md.
  author: nwob-agent-skills
  license: MIT

provides:
  agent: agents/pod-builder.md
  skills:
    - lead-builder/validate-design-package
    - lead-builder/review-implementation
    - lead-builder/audit-and-approve-code
    - builder/co-design-solution
    - builder/trigger-ai-build
    - builder/raise-merge-request
    - builder/resolve-review-comments
  cursor:
    rules:
      persona: true
      boundaries:
        - rules/pod-builder-skill-boundaries.md
        - rules/task-breakdown-patterns.md
        - rules/build-execution-patterns.md
        - rules/builder-quality-patterns.md
        - rules/merge-request-patterns.md
  commands:
    - name: audit
      skill: lead-builder/audit-and-approve-code
      scaffold: nwob-docs/observations/audit-report.md
      template: lb/audit-report-template.md
  templates:
    - sdd/story-spec-template.md
    - sdd/story-tasks-template.md
    - lb/story-plan-template.md
    - lb/execution-plan-template.md
    - lb/audit-report-template.md
  scaffolds:
    - path: nwob-docs/observations/audit-report.md
      template: lb/audit-report-template.md
      commands: [audit]

artifacts:
  - path: nwob-docs/sdd/stories/
    produced_by: [co-design-solution]
  - path: nwob-docs/observations/audit-report.md
    produced_by: [audit]

tags: [build, sdd, tasks, audit, co-design, mr, quality]
