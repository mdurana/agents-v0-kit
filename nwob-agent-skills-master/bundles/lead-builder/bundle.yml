schema_version: "2.0"

bundle:
  id: lead-builder
  name: Lead Builder
  version: "3.0.0"
  role: lead-builder
  description: >-
    Co-equal with Solution Architect: full SA architecture and SDD author skills,
    plus design orchestration, design validation, increment review, and MR audit.
    Authors epic-spec.md (backlog index + HL US/TS), masterplan.md (dual with
    architecture.md), flat sdd/components/{component-name}-plan.md, story-spec.md
    (product + technical annex), and story-tasks.md. Does not generate epic-plan.md,
    epic-tasks.md, or story-plan.md. Activates via slash commands and intent.
  author: nwob-agent-skills
  license: MIT

provides:
  agent: agents/lead-builder.md
  skills:
    - solution-architect/architect-led-sdd-intake
    - solution-architect/architecture-governance
    - solution-architect/distributed-systems-architecture
    - solution-architect/architecture-delivery-enablement
    - solution-architect/production-operations
    - product-owner/business-problem-identification
    - product-owner/product-ideation
    - product-owner/product-roadmap-creation
    - product-owner/feature-definition
    - product-owner/presentation-intake-update
    - lead-builder/orchestrate-design
    - lead-builder/validate-design-package
    - lead-builder/review-implementation
    - lead-builder/audit-and-approve-code
  cursor:
    rules:
      persona: true
      boundaries:
        - rules/lead-builder-skill-boundaries.md
        - rules/solution-architect-skill-boundaries.md
        - rules/solution-architect-command-standards.md
        - rules/product-owner-skill-boundaries.md
        - rules/intent-interview-patterns.md
        - rules/ideation-frameworks.md
        - rules/task-breakdown-patterns.md
        - rules/builder-quality-patterns.md
  commands:
    - name: define
      skill: solution-architect/architect-led-sdd-intake
      scaffold: nwob-docs/sdd/epic-spec.md
      template: sdd/spec-template.md
      note: Orchestrates problem → ideate → roadmap → features; scaffolds epic-spec.md and intake-record.md
    - name: problem
      skill: product-owner/business-problem-identification
      scaffold: nwob-docs/sdd/epic-spec.md
      template: sdd/spec-template.md
    - name: ideate
      skill: product-owner/product-ideation
      scaffold: nwob-docs/sdd/epic-spec.md
      template: sdd/spec-template.md
    - name: roadmap
      skill: product-owner/product-roadmap-creation
      scaffold: nwob-docs/sdd/epic-spec.md
      template: sdd/spec-template.md
    - name: features
      skill: product-owner/feature-definition
      scaffold: nwob-docs/sdd/epic-spec.md
      template: sdd/spec-template.md
    - name: intake
      skill: product-owner/presentation-intake-update
      scaffold: nwob-docs/presentations/intake-record.md
      template: presentations/intake-record-template.md
    - name: c4
      skill: solution-architect/architecture-governance
      scaffold: nwob-docs/architecture/architecture.md
      template: sa/architecture-outline.md
      note: Dual-persist to nwob-docs/sdd/masterplan.md
    - name: pattern
      skill: solution-architect/architecture-governance
      scaffold: nwob-docs/architecture/adr/ADR-001-architectural-pattern-selection.md
      template: sa/adr-template.md
    - name: platform
      skill: solution-architect/distributed-systems-architecture
      scaffold: nwob-docs/architecture/network.md
      template: sa/architecture-outline.md
    - name: services
      skill: solution-architect/distributed-systems-architecture
      scaffold: nwob-docs/architecture/service-map.md
      template: sa/service-map-template.md
      note: Lazy flat plans under nwob-docs/sdd/components/{component-name}-plan.md
    - name: contracts
      skill: solution-architect/architecture-delivery-enablement
    - name: ops
      skill: solution-architect/production-operations
    - name: adr
      skill: solution-architect/architecture-governance
      scaffold: nwob-docs/architecture/adr/
      template: sa/adr-template.md
    - name: arc
      skill: solution-architect/architecture-governance
    - name: architecture
      skill: solution-architect/architecture-governance
      note: Full SA chain per solution-architect-command-standards.md; dual-persist masterplan.md
    - name: orchestrate-design
      skill: lead-builder/orchestrate-design
      scaffold: nwob-docs/sdd/design-package.md
      template: lb/design-package-outline.md
    - name: audit
      skill: lead-builder/audit-and-approve-code
      scaffold: nwob-docs/observations/audit-report.md
      template: lb/audit-report-template.md
  templates:
    - sdd/spec-template.md
    - sdd/story-spec-template.md
    - sdd/story-tasks-template.md
    - presentations/intake-record-template.md
    - lb/design-package-outline.md
    - lb/audit-report-template.md
    - lb/story-plan-template.md
    - sa/adr-template.md
    - sa/architecture-outline.md
    - sa/component-plan-template.md
    - sa/service-map-template.md
  scaffolds:
    - path: nwob-docs/sdd/epic-spec.md
      template: sdd/spec-template.md
      commands: [define, problem, ideate, roadmap, features]
    - path: nwob-docs/sdd/design-package.md
      template: lb/design-package-outline.md
      commands: [orchestrate-design]
    - path: nwob-docs/sdd/masterplan.md
      template: sa/architecture-outline.md
      commands: [c4, platform, architecture, orchestrate-design]
    - path: nwob-docs/presentations/intake-record.md
      template: presentations/intake-record-template.md
      commands: [define, problem, intake]
    - path: nwob-docs/architecture/service-map.md
      template: sa/service-map-template.md
      commands: [services, contracts, architecture]
    - path: nwob-docs/architecture/architecture.md
      template: sa/architecture-outline.md
      commands: [c4, platform, architecture]
    - path: nwob-docs/architecture/network.md
      template: sa/architecture-outline.md
      commands: [platform]
    - path: nwob-docs/architecture/adr/
      template: sa/adr-template.md
      commands: [pattern, adr]
    - path: nwob-docs/observations/audit-report.md
      template: lb/audit-report-template.md
      commands: [audit]

artifacts:
  - path: nwob-docs/sdd/epic-spec.md
    produced_by: [define, problem, ideate, roadmap, features]
  - path: nwob-docs/sdd/stories/
    produced_by: [features]
  - path: nwob-docs/sdd/design-package.md
    produced_by: [orchestrate-design]
  - path: nwob-docs/sdd/masterplan.md
    produced_by: [c4, platform, services, architecture, orchestrate-design]
  - path: nwob-docs/sdd/components/
    produced_by: [services, ops, architecture, orchestrate-design]
  - path: nwob-docs/presentations/intake-record.md
    produced_by: [define, problem, intake]
  - path: nwob-docs/architecture/architecture.md
    produced_by: [c4, platform, services, architecture, orchestrate-design]
  - path: nwob-docs/architecture/service-map.md
    produced_by: [services, contracts, architecture]
  - path: nwob-docs/architecture/network.md
    produced_by: [platform, ops, architecture]
  - path: nwob-docs/architecture/adr/
    produced_by: [pattern, adr, architecture]
  - path: nwob-docs/observations/audit-report.md
    produced_by: [audit]

tags: [audit, design, review, sdd, tasks, architecture, adr, c4, governance, spec]
