schema_version: "2.0"

bundle:
  id: builder
  name: Builder
  version: "2.0.0"
  role: builder
  description: >-
    Co-design annex workshop (technical sections in story-spec.md + story-tasks.md),
    AI-assisted build execution, GitLab MR draft copy, and pasted review-comment
    resolve skills for the AI-augmented engineering pod. Annex section patterns:
    lb/story-plan-template.md (reference only — do not create story-plan.md).
  author: nwob-agent-skills
  license: MIT

provides:
  agent: agents/builder.md
  skills:
    - builder/co-design-solution
    - builder/trigger-ai-build
    - builder/raise-merge-request
    - builder/resolve-review-comments
  cursor:
    rules:
      persona: true
      boundaries:
        - rules/builder-skill-boundaries.md
        - rules/build-execution-patterns.md
        - rules/merge-request-patterns.md
  commands: []
  templates:
    - sdd/story-spec-template.md
    - sdd/story-tasks-template.md
    - lb/execution-plan-template.md
    - lb/story-plan-template.md
  scaffolds: []

artifacts:
  - path: nwob-docs/sdd/stories/
    produced_by: [co-design-solution]

tags: [build, co-design, mr]
