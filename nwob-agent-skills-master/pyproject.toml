[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nwob-cli"
version = "1.0.0"
description = "Initialize NWOB agent skills in target repositories with persona-scoped bundles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "pyyaml>=6.0",
]

[project.scripts]
nwob = "nwob_cli.cli:app"

[tool.hatch.build.targets.wheel]
only-include = ["src/nwob_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/nwob_cli" = "nwob_cli"
"rules" = "rules"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/bundles",
  "/templates",
  "/skills",
  "/agents",
  "/references",
  "/integrations",
  "/rules",
]
